name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install ruff complexipy pip-audit
      - name: Lint with ruff
        run: ruff check backend/
      - name: Check cognitive complexity
        run: complexipy backend --max-complexity-allowed 15
      - name: Run database migrations
        working-directory: backend
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: alembic upgrade head
      - name: Run backend tests
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          PYTHONPATH: .
          JWT_SECRET_KEY: heimdall-ci-test-key-not-for-production-use-only
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_MINUTES: "30"
        run: >
          pytest backend/tests
          --cov=backend.app
          --cov-report=term-missing
          --cov-fail-under=60
      - name: Audit backend dependencies
        # requirements-dev.txt includes requirements.txt via -r.
        # Ignored until their major-version upgrades are done separately:
        #   PYSEC-2026-1845: fix needs pytest 9 (pinned 8.4.2, dev/test only).
        #   PYSEC-2026-161, -248, -249, -2280, -2281: fixes need starlette 1.x
        #   (0.52.1 is pulled in by fastapi==0.128.8).
        run: >
          pip-audit -r backend/requirements-dev.txt
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281

  osint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install OSINT dependencies
        run: |
          pip install -r ai-brain/requirements.txt
          pip install pytest ruff complexipy pip-audit
      - name: Lint OSINT module
        run: ruff check ai-brain/
      - name: Check OSINT cognitive complexity
        run: complexipy ai-brain --max-complexity-allowed 15
      - name: Run OSINT tests
        run: pytest ai-brain/tests -q
      - name: Audit OSINT dependencies
        run: pip-audit -r ai-brain/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install frontend dependencies
        run: pip install -r frontend/requirements.txt
      - name: Run frontend/dashboard tests
        run: pytest tests/
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/frontend-console/package-lock.json

      - name: Install frontend console test dependencies
        working-directory: tests/frontend-console
        run: npm ci --no-audit --no-fund

      - name: Run frontend console tests
        working-directory: tests/frontend-console
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install vision dependencies
        run: |
          pip install -r vision/requirements.txt
          pip install pytest ruff complexipy pip-audit
      - name: Lint vision module
        run: ruff check vision/
      - name: Check vision cognitive complexity
        run: complexipy vision --max-complexity-allowed 15
      - name: Run vision tests
        run: |
          if [ ! -d vision/tests ]; then
            echo "::notice title=Vision tests skipped::vision/tests does not exist yet, so pytest was not run."
            exit 0
          fi
          pytest vision/tests -q
      - name: Audit vision dependencies
        run: pip-audit -r vision/requirements.txt


  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      JWT_SECRET_KEY: heimdall-ci-test-key-not-for-production-use-only

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Start Heimdall services
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Wait for frontend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Seed test data
        run: docker compose exec -T api python -m backend.app.seed

      - name: Run Playwright E2E test
        working-directory: tests/e2e
        run: npm test

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs

      - name: Stop Heimdall services
        if: always()
        run: docker compose down -v

  e2e-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pipeline E2E dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -r ai-brain/requirements.txt
      - name: Run OSINT pipeline E2E
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          PYTHONPATH: .
          JWT_SECRET_KEY: heimdall-ci-test-key-not-for-production-use-only
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_MINUTES: "30"
        run: pytest -m e2e tests/e2e_pipeline -q
